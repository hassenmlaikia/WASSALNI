name: wassalni
description: WASSALNI - Premium ride-hailing and delivery platform for Tunisia.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Navigation
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.0
  firebase_database: ^10.4.0

  # Networking
  dio: ^5.4.0

  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.19.0
  logger: ^2.0.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true